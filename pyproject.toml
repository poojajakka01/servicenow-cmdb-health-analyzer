[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdb-health-analyzer"
version = "1.0.0"
description = "Offline CMDB completeness, correctness and compliance scoring for ServiceNow exports"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pooja Jakka"}]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cmdb-health = "cmdb_health.cli:main"

[tool.setuptools]
packages = ["cmdb_health"]

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F"]
